name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shards:
    name: shards (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.shard == 'browser' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [foundation, api, portable, browser]
    env:
      GLOVE_VERIFY_SHARD: ${{ matrix.shard }}
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Reclaim unused hosted runner toolchain space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          # rer dev and preview (the export/restore proof and browser journeys)
          # require 15 GiB free. This JavaScript job does not use Android, .NET
          # or Haskell; Node, browsers and caches stay.
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.shard != 'api'
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run verify

  # Keep the required check stable and fail closed for failed or skipped shards.
  verify:
    if: always()
    needs: [shards]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification shard
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          test "$SHARDS_RESULT" = success
